name: SakuBot poll
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python poll.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WEBHOOK_BLOG: ${{ secrets.WEBHOOK_BLOG }}
          WEBHOOK_NEWS: ${{ secrets.WEBHOOK_NEWS }}
          WEBHOOK_TICKET: ${{ secrets.WEBHOOK_TICKET }}
          WEBHOOK_FCNEWS: ${{ secrets.WEBHOOK_FCNEWS }}
          WEBHOOK_YOUTUBE: ${{ secrets.WEBHOOK_YOUTUBE }}
          WEBHOOK_TIKTOK: ${{ secrets.WEBHOOK_TIKTOK }}
          WEBHOOK_X: ${{ secrets.WEBHOOK_X }}
          WEBHOOK_INSTAGRAM: ${{ secrets.WEBHOOK_INSTAGRAM }}
          WEBHOOK_SCHEDULE: ${{ secrets.WEBHOOK_SCHEDULE }}
          WEBHOOK_STATUS: ${{ secrets.WEBHOOK_STATUS }}
          WEBHOOK_PHOTOS: ${{ secrets.WEBHOOK_PHOTOS }}
          RSSHUB_BASE: ${{ vars.RSSHUB_BASE }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || (git commit -m "update state" && git pull --rebase && git push)